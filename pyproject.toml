[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyacmecli"
version = "0.2.0"
requires-python = '>=3.12'
dependencies = [
    "click==8.3.0",
    "cryptography==46.0.2",
    "dnspython==2.8.0",
    "requests==2.32.5",
    "tabulate==0.9.0",
    "tldextract>=5.3.0",
    "validators==0.35.0",
]
readme = "readme.md"

[project.optional-dependencies]
route53 = ["boto3>=1.34"]

[project.scripts]
pyacmecli = "pyacmecli.__main__:main_command"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "build>=1.3.0",
    "mypy>=1.13",
    "pre-commit>=4.5.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.8",
    "twine>=6.2.0",
    "types-requests>=2.33.0.20261030",
    "types-tabulate>=0.10.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"


[tool.ruff]
line-length = 80

#[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
#extend-select = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pyacmecli"]

[[tool.mypy.overrides]]
# boto3 ships no type information and is an optional dependency.
module = ["boto3", "boto3.*"]
ignore_missing_imports = true
