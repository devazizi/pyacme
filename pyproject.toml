[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
pyacmecli = "pyacmecli.__main__:main_command"

[project]
name = "pyacmecli"
version = "0.1.7"
requires-python = '>=3.12'
dependencies = [
    "build==1.3.0",
    "click==8.3.0",
    "cryptography==46.0.2",
    "dnspython==2.8.0",
    "pyproject-hooks==1.2.0",
    "requests==2.32.5",
    "setuptools==80.9.0",
    "tabulate==0.9.0",
    "tldextract>=5.3.0",
    "validators==0.35.0",
]
readme = "readme.md"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.14.8",
    "twine>=6.2.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]
